name: CI/CD Pipeline - PetClinic G11

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: af-south-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.af-south-1.amazonaws.com
  EKS_CLUSTER: petclinic-cluster-g11

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: af-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker images
        run: |
          ./mvnw clean install -P buildDocker -DskipTests

      - name: Tag and Push images to ECR
        run: |
          ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}
          REGISTRY=$ACCOUNT_ID.dkr.ecr.af-south-1.amazonaws.com
          TAG=${{ github.sha }}

          for service in config-server discovery-server api-gateway customers-service vets-service visits-service genai-service; do
            docker tag springcommunity/spring-petclinic-$service:latest \
              $REGISTRY/spring-petclinic-g11-$service:$TAG
            docker tag springcommunity/spring-petclinic-$service:latest \
              $REGISTRY/spring-petclinic-g11-$service:latest
            docker push $REGISTRY/spring-petclinic-g11-$service:$TAG
            docker push $REGISTRY/spring-petclinic-g11-$service:latest
            echo "✅ Pushed: spring-petclinic-g11-$service"
          done

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: af-south-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region af-south-1 \
            --name petclinic-cluster-g11

      - name: Deploy to EKS with Helm
        run: |
          helm upgrade --install petclinic-g11 ./helm/petclinic \
            --namespace petclinic-staging-g11 \
            --create-namespace \
            --set image.tag=${{ github.sha }} \
            --set image.registry=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.af-south-1.amazonaws.com

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/spring-petclinic-api-gateway \
            -n petclinic-staging-g11 --timeout=300s
