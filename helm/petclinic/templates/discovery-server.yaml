apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-petclinic-discovery-server
  namespace: petclinic-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-server
  template:
    metadata:
      labels:
        app: discovery-server
    spec:
      imagePullSecrets:
        - name: ecr-secret
      initContainers:
        - name: wait-for-config
          image: busybox
          command: ['sh', '-c', 'until wget -q http://spring-petclinic-config-server:8888/actuator/health; do echo waiting; sleep 5; done']
      containers:
        - name: discovery-server
          image: 118821711881.dkr.ecr.af-south-1.amazonaws.com/spring-petclinic-g11-discovery-server:latest
          ports:
            - containerPort: 8761
          env:
            - name: SPRING_CONFIG_IMPORT
              value: "configserver:http://spring-petclinic-config-server:8888"
            - name: SPRING_CLOUD_CONFIG_URI
              value: "http://spring-petclinic-config-server:8888"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: spring-petclinic-discovery-server
  namespace: petclinic-staging
spec:
  selector:
    app: discovery-server
  ports:
    - port: 8761
      targetPort: 8761
