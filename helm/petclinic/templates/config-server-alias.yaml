apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: petclinic-staging
spec:
  selector:
    app: config-server
  ports:
    - port: 8888
      targetPort: 8888
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  namespace: petclinic-staging
spec:
  selector:
    app: discovery-server
  ports:
    - port: 8761
      targetPort: 8761
