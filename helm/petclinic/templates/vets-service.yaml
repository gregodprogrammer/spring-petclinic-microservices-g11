apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-petclinic-vets-service
  namespace: petclinic-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vets-service
  template:
    metadata:
      labels:
        app: vets-service
    spec:
      imagePullSecrets:
        - name: ecr-secret
      initContainers:
        - name: wait-for-discovery
          image: busybox
          command: ['sh', '-c', 'until wget -q http://spring-petclinic-discovery-server:8761/actuator/health; do echo waiting; sleep 5; done']
      containers:
        - name: vets-service
          image: 118821711881.dkr.ecr.af-south-1.amazonaws.com/spring-petclinic-g11-vets-service:latest
          ports:
            - containerPort: 8083
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: spring-petclinic-vets-service
  namespace: petclinic-staging
spec:
  selector:
    app: vets-service
  ports:
    - port: 8083
      targetPort: 8083
