apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-petclinic-config-server
  namespace: petclinic-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: config-server
          image: 118821711881.dkr.ecr.af-south-1.amazonaws.com/spring-petclinic-g11-config-server:latest
          ports:
            - containerPort: 8888
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: spring-petclinic-config-server
  namespace: petclinic-staging
spec:
  selector:
    app: config-server
  ports:
    - port: 8888
      targetPort: 8888
